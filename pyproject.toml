[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arrow-ad"
version = "0.1.0"
description = "Active Directory attack-path mapper CLI"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Arrow Team" }]
dependencies = [
    "typer>=0.9.0",
    "networkx>=3.0",
    "rich>=13.0",
    "pydantic>=2.0",
    "ldap3>=2.9.1",
    "impacket>=0.13.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
llm = [
    "anthropic>=0.40.0",
]

[project.scripts]
arrow = "arrow.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["arrow*"]

